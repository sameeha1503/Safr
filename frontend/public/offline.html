<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff7ed" />
    <title>Safr is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #fff7ed; color: #292524; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 420px; padding: 28px; border: 1px solid #fed7aa; border-radius: 24px; background: white; box-shadow: 0 18px 50px #9a34121a; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { color: #57534e; }
      a, button { display: block; width: 100%; box-sizing: border-box; margin-top: 12px; padding: 13px 16px; border: 0; border-radius: 14px; text-align: center; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
      .retry { background: #ea580c; color: white; }
      .emergency { background: #fee2e2; color: #991b1b; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Live maps, tracking and new plans need a connection. Previously opened pages may still be available.</p>
      <button class="retry" onclick="location.reload()">Try again</button>
      <a class="emergency" href="tel:112">Call emergency services · 112</a>
      <a href="/emergency">Open saved emergency contacts</a>
    </main>
  </body>
</html>
